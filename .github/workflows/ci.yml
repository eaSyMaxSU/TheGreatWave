name: CI

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install window system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config \
            libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev \
            libxcb1-dev libx11-xcb-dev libfontconfig-dev libfreetype-dev
      - name: Format
        run: cargo fmt --check
      - name: Renderer (no dependencies)
        run: cargo test --no-default-features
      - name: Headless watcher
        run: cargo test --no-default-features --features watch
      - name: Viewer
        run: cargo test
      - name: Clippy
        run: |
          cargo clippy --all-targets -- -D warnings
          cargo clippy --all-targets --no-default-features --features watch -- -D warnings
          cargo clippy --all-targets --no-default-features -- -D warnings
      - name: Release binary
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: tgw-${{ runner.os }}
          path: |
            target/release/tgw
            target/release/tgw.exe
          if-no-files-found: error
